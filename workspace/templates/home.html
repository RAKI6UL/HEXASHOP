{% extends 'seller_nav.html' %}
{% load static %}

{% block seller_nav %}

<!-- Rest of your content -->
<div class="container" style="margin-top: 200px; font-family: 'Times New Roman', Times, serif;">
    <div class="row">
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px;">
            {% for product in seller_products %}
            <div style="flex-basis: 30%; border: 1px solid #ddd; border-radius: 10px; padding: 15px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); text-align: center;">
                <img src="{{ product.product.image.url }}" alt="Product 1" style="max-width: 100%; height: 150px; object-fit: cover; border-radius: 10px;">
                <p style="font-size: 18px; font-weight: bold;font-family:Times Roman; margin: 10px 0;">{{ product.product.product_name }}</p>
                <p style="font-size: 14px; color: #888;">{{ product.created_at }}</p>
                <p style="font-size: 16px; font-weight: bold; margin: 10px 0;">𝙿𝚛𝚒𝚌𝚎: {{ product.product.price }}</p>
                <button style="background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: background-color 0.3s ease;">𝚅𝚒𝚎𝚠 𝙳𝚎𝚝𝚊𝚒𝚕𝚜</button>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- Add Bootstrap and jQuery scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
{% endblock %}
