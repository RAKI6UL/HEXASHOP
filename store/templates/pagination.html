<div class="pagination">
    <span class="step-links">
        {% if page.has_previous %}
        <a href="?page={{page.previous_page_number}}">𝙿𝚛𝚎𝚟𝚒𝚘𝚞𝚜</a>
        {% endif %}
        <span class="current">
            Page {{ page.number }} of {{ page.paginator.num_pages }}.
        </span>
        {% if page.has_next %}
        <a href="?page={{ page.next_page_number }}">𝙽𝚎𝚡𝚝</a>
        {% endif %}
    </span>
</div>
